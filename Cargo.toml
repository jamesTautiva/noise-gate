[package]
name = "djentCutNoise"
version = "1.0.0"
edition = "2021"

[lib]
name = "djentCutNoise"
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["standalone", "vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug" }
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8"
atomic_float = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "process_benchmark"
harness = false

[workspace]
members = ["xtask"]
