name: Build macOS VST3

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        targets: x86_64-apple-darwin, aarch64-apple-darwin
    
    - name: Build x86_64
      run: cargo run --package xtask -- bundle noise-gate --release --target x86_64-apple-darwin
    
    - name: Build aarch64 (Apple Silicon)
      run: cargo run --package xtask -- bundle noise-gate --release --target aarch64-apple-darwin
    
    - name: Create universal binary
      run: cargo run --package xtask -- bundle-universal noise-gate --release
    
    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: noise-gate-macos-universal
        path: target/bundle/release/noise-gate.vst3
